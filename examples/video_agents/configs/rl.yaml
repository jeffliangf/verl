hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# Prepared immutable experiment; supplied by the launcher.
video_rl:
  protocol: ???

  output_dir: ???

  # Stop a persistent outage after replacing at most one training batch of groups.
  max_dropped_groups_per_step: ${data.train_batch_size}

  # The only provider limits, in seconds; a frozen protocol's own limits are
  # ignored. Service limits are about 2x the healthy P99 of canary job 2391, so
  # the slowest ~1% is dropped instead of awaited.
  timeouts:
    # A stall guard, not a tail cut: an LLM turn takes ~response tokens / 15 tok/s,
    # so data.max_response_length (8192) bounds it near 540 s. A lower limit would
    # drop the policy's own long outputs instead of scoring them; cap tokens instead.
    llm: 900
    h3: 150
    h3_request: 30
    judge_request: 45
    judge_file: 60
    judge_control: 15
    judge_pass: 300

  # Gemini attempts per HTTP call: one fast retry for 408/429/5xx and
  # upload/polling network errors. Judgment network timeouts are not retried.
  judge_max_attempts: 2

  # Held-out evaluation drops unscorable prompts; flag it degraded below this.
  min_valid_eval_fraction: 0.9

data:
  train_batch_size: 16

  max_prompt_length: 4096

  max_response_length: 8192

  truncation: error

  return_raw_chat: true

  filter_overlong_prompts: false

  dataloader_num_workers: 2

  # Model-visible options live in each dataset row's chat_template_kwargs.
  apply_chat_template_kwargs: {}

actor_rollout_ref:
  model:
    path: Qwen/Qwen3.8-27B

    use_remove_padding: false

    use_fused_kernels: false

    enable_gradient_checkpointing: true

  actor:
    strategy: fsdp2

    ppo_mini_batch_size: 16

    ppo_micro_batch_size_per_gpu: 1

    use_dynamic_bsz: false

    use_torch_compile: false

    use_kl_loss: true

    kl_loss_coef: 0.01

    kl_loss_type: low_var_kl

    optim:
      lr: 1.0e-6

    fsdp_config:
      param_offload: true

      optimizer_offload: true

    checkpoint:
      save_contents: [model, optimizer, extra, hf_model]

  ref:
    log_prob_micro_batch_size_per_gpu: 1

    fsdp_config:
      param_offload: true

  rollout:
    name: vllm

    n: 4

    temperature: 0.7

    top_p: 0.9

    tensor_model_parallel_size: 4

    gpu_memory_utilization: 0.55

    max_model_len: 12288

    max_num_batched_tokens: 16384

    max_num_seqs: 32

    enforce_eager: true

    # The policy emits text/tool calls; Gemini consumes the generated videos.
    engine_kwargs:
      vllm:
        limit_mm_per_prompt:
          image: 0
          video: 0

    calculate_log_probs: true

    log_prob_micro_batch_size_per_gpu: 1

    agent:
      num_workers: 4

      default_agent_loop: h3_terminal

      agent_loop_manager_class: examples.video_agents.agent.TournamentManager

    multi_turn:
      enable: true

      format: qwen3_coder

      max_assistant_turns: null

      max_user_turns: null

      max_parallel_calls: 1

    val_kwargs:
      n: 1

      do_sample: false

      temperature: 0

      top_p: 1

      top_k: -1

algorithm:
  adv_estimator: grpo

  use_kl_in_reward: false

trainer:
  use_v1: true

  v1:
    trainer_mode: sync

    sampler:
      sync_refill_failed_groups: true

  project_name: video-agents-rl

  experiment_name: qwen38-h3-tournament

  logger: [console, tensorboard]

  nnodes: 1

  n_gpus_per_node: 8

  total_epochs: 1

  total_training_steps: 10

  val_before_train: false

  save_freq: 5

  test_freq: 10

  resume_mode: auto
